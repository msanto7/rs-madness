services:
  db:
    image: postgres:18
    container_name: rsmadness-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rsmadness
    volumes:
      - pgdata18:/var/lib/postgresql

volumes:
  pgdata18: